# ────────────────────────────────────────────────────────────
# Omarchy Coppernight Theme 
# ────────────────────────────────────────────────────────────

$accent = rgba(fab387ff) 
$inner_color = rgba(15,25,45,0.8)     # Midnight navy
$outer_color = rgba(255,139,145,1.0)   # Neon azure
$font_color = rgba(180,220,255,1.0)   # Frosted cyan
$check_color = rgba(255,209,105,1.0)   # Electric aqua
$fail_color = rgba(255,109,105,1.0)    # Alert blue
$input_color = rgba(255,109,105,0.5)       # Deep sea shadow
$lite_orange = rgba(ffbd69ff)
$text = rgba(dcd6d6ff)
$font = JetBrainsMono Nerd Font

general {
    no_fade_in = false
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = fluent_out, 0.1, 1, 0, 1
    animation = fadeIn, 1, 3, fluent_out
    animation = fadeOut, 1, 3, fluent_out
}

background {
    monitor =
    path = ~/.config/omarchy/current/theme/Lockscreen/1.jpg 
    blur_passes = 3 
    blur_size = 7
}

# 1. CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $text
    font_size = 120
    font_family = $font ExtraBold
    position = -100, 310
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $accent
    font_size = 120
    font_family = $font Thin
    position = 100, 310
    halign = center
    valign = center
}

# 2. DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = $text
    font_size = 16
    font_family = $font Bold
    position = 0, 210
    halign = center
    valign = center
    letter_spacing = 4
}

# 3. PROFILE PICTURE (Hero Size)
image {
    monitor =
    path = ~/.config/omarchy/current/theme/Lockscreen/profile.jpg
    size = 210
    rounding = -1
    border_size = 1
    border_color = $lite_orange 
    position = 0, -250
    halign = center
    valign = center
}

# 6. QUOTE
label {
    monitor =
    text = cmd[update:300000] shuf -n 1 ~/.config/hypr/quotes.txt
    color = $text
    font_size = 13
    font_family = $font Light Italic
    position = 0, 50
    halign = center
    valign = bottom
    width = 1000
    text_align = center
}
