# GitHub Dark theme for Alacritty
# https://github.com/primer/github-vscode-theme

[colors.primary]
background = "#0d1117"
foreground = "#e6edf3"
bright_foreground = "#f0f6fc"

[colors.cursor]
text = "#0d1117"
cursor = "#e6edf3"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#264f78"

[colors.normal]
black = "#484f58"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#b1bac4"

[colors.bright]
black = "#6e7681"
red = "#ffa198"
green = "#56d364"
yellow = "#e3b341"
blue = "#79c0ff"
magenta = "#d2a8ff"
cyan = "#56d4dd"
white = "#f0f6fc"

[colors.search.matches]
foreground = "#0d1117"
background = "#3fb950"

[colors.search.focused_match]
foreground = "#0d1117"
background = "#d29922"

[colors.footer_bar]
background = "#0d1117"
foreground = "#e6edf3"

[colors.hints.start]
foreground = "#0d1117"
background = "#d29922"

[colors.hints.end]
foreground = "#d29922"
background = "#0d1117"
