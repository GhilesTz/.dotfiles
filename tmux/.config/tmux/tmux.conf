# prefix is C-p
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# using | and - instead of % and "
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set-window-option -g mode-keys vi
# prefix + h/j/k/l — switch tmux panes (manual)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# enable mouse
set -g mouse on

# begin from 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

bind c neww -c '#{pane_current_path}'

# clean right side
set -g status-right ""
set -g status-left ""

set -g status-position top

set -g status-justify "centre"
set -g status "on"

set -g status-style bg=default
set -g extended-keys on
set -g extended-keys-format csi-u

# M-k / M-j — scroll pi pane from any pane (vi-directional)
bind-key -n 'M-k' run-shell '~/.config/tmux/scroll-pi.sh up'
bind-key -n 'M-j' run-shell '~/.config/tmux/scroll-pi.sh down'

# Keybinding help
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
